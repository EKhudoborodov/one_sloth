{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>My Playground</title>
        <link rel="stylesheet" href="{% static 'main/css/style.css' %}">
    </head>
    <body>
    <div class="columns-container">
        {% for cat_num, items in columns.items %}
        <div class="column">
            {% for achievement in items %}
            <div class="steam-achievement">
                <div class="achievement-icon">
                    <img src="{{ achievement.link_href }}" alt="Achievement Icon">
                </div>
                <div class="achievement-info">
                    <div class="achievement-title">{{ achievement.title }}</div>
                    <div class="achievement-name">{{ achievement.name }}</div>
                    <div class="achievement-desc">{{ achievement.desc }}</div>
                    <div class="achievement-progress">
                        <div class="progress-bar" style="width: {{ achievement.progress }}%;"></div>
                    </div>
                </div>
            </div>
            {% empty %}
            <p class="empty-column">Пусто</p>
            {% endfor %}
        </div>
        {% endfor %}
    </div>

</body>
</html>
